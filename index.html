    <script>
      (() => {
        const redirect = window.location.search;
        if (redirect.startsWith('?/')) {
          const restoredPath = redirect
            .slice(1)
            .split('&')
            .map((segment) => segment.replace(/~and~/g, '&'))
            .join('?');
          window.history.replaceState(null, '', restoredPath + window.location.hash);
        }

        let savedTheme;
        try {
          savedTheme = window.localStorage.getItem('enqi-theme-v1');
        } catch {
          savedTheme = null;
        }
        const systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme =
          savedTheme === 'dark' || savedTheme === 'light' ? savedTheme : systemTheme;
      })();
    </script>
