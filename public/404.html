<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Redirecting — Enqi Jing</title>
    <script>
      (() => {
        const location = window.location;
        const path = location.pathname.slice(1).replace(/&/g, '~and~');
        const query = location.search
          ? `&${location.search.slice(1).replace(/&/g, '~and~')}`
          : '';
        const port = location.port ? `:${location.port}` : '';

        location.replace(
          `${location.protocol}//${location.hostname}${port}/?/${path}${query}${location.hash}`,
        );
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to <a href="https://jingenqi.tech/">jingenqi.tech</a>…</p>
  </body>
</html>
